<div class="container-fluid background" id="background">
	<div class="row">
		<div class="col-lg-4 col-md-6 col-sm-12">
			<div class="logo d-flex">
				<!-- <img
					[src]="'./../../../../../assets/images/' + loginObj.logoURL"
					class="logoImg mr-3"
				/> -->
				<!-- <p>{{ loginObj.title }}</p> -->
			</div>
		</div>
	</div>
	<div class="row">

		<div class="col-lg-12 col-sm-12">
			<div class="backImg" class="col-lg-12 col-md-12 col-sm-12 row">
				<div class="col-lg-4 col-md-4 col-sm-4">
					<img src="../../../../../assets/images/samagrashikshalogo.png" style="width: 150px;height: 60px;" />
				</div>
				<div class="col-lg-4 col-md-4 col-sm-4">
					<img src="../../../../../assets/images/satyaMevjate.png"
						style="width: 150px; height: 90px;transform: translate(100px, 0px);" />
				</div>
				<div class="col-lg-4 col-md-4 col-sm-4">
					<img src="../../../../../assets/images/pm-shri-removebg-preview.png"
						style="width: 150px; height: 60px;transform:translate(270px, 10px)" />
				</div>
				<!-- <img [src]="'./../../../../../assets/images/' + loginObj.imageURL" /> -->
			</div>

		</div>
	<div class="hero">
		<div class="container hero-wrapper">
			<div class="hero-text" style="transform:translate(40px, 100px)">
				<h1>Vidya Samiksha Kendra</h1>
				<h3>Government of Puducherry</h3>
				<h3>Directorate of School Education</h3>
				<h3>Samagra Shiksha</h3>
			</div>
			<div class="col-lg-5 col-md-5  col-sm-12">
				<div class="row" (click)="onSubmit()">
					<div class="col-sm-12">
						<div class="logoText">
							<!-- <p>{{ stateName }}</p> -->
						</div>
					</div>
				</div>
				<div class="login-box" style="transform: translate(800px, -300px);">
					
						<div class="col-lg-12 col-md-12 col-sm-12" style="padding-top: 10px;">
							
							<div id="kc-content-wrapper">
								<div>
									<div class="alert alert-error d-flex" *ngIf="error">
										<span class="pficon fa fa-times-circle fa-2x text-danger">{{
											'Invalid
											Credentials'
											}}</span>

										<span class="kc-feedback-text ml-2"></span>
									</div>
									<!--<div class="login-box">-->
										<h2>Login</h2>
										<div class="login-form">
											<form class="form" [formGroup]="LoginForm" (ngSubmit)="onSubmitPrivate()"
												id="kc-form-login1" autocomplete="off">
												<label>Username</label><br />
												<input id="username1" class="login-field" formControlName="userId"
													placeholder="Enter your username" type="text" name="username" tabindex="1" 
													style="background-color: white;border: none"/>
												<br /><br />
												<label>Password</label>
												<input type="password" id="password1" class="login-field"
													formControlName="password" placeholder="Enter your password" name="password"
													tabindex="2" style="background-color: white;border: none"/>
												<br />
												<br />
												<button [ngClass]="LoginForm.valid ? 'valid' : ''" class="submit" type="submit"
													id="login" name="login" value="Login" tabindex="3" 
													style="background-color: #00bcd4;border: none">
													Sign In
												</button>
											</form>
										</div>
									<!--</div>-->
								</div>
							</div>
							<div class="dashboard_route_div">
								<button (click)="onSubmit()" tabindex="4" class="dashboard_route">Go To Public
									Dashboard</button>
							</div>
							<div id="toggle" onclick="toggleDiv()"></div>
						</div>
					
				</div>
			</div>
		</div>
						<div id="div2" style="display:none;">
							<div class="row">
								<div class="col-lg-12 col-sm-12" style="">
									<div class="infoText" style="color: black;font-style: italic;float: right;">
										<!-- Shared seeing for coordinated action towards achieving outcomes and goals -->
										<h6 style="
												color: white;
												font-size: 16px;
												font-weight: bold;
												line-height: 1.4em;
												margin-top: 10px;
												transform:translate(-80px, 100px)
											">
											{{ loginObj.tagLine }}
										</h6>
									</div>
								</div>
							</div>
						</div>
						<div class="infoText" style="color: black;font-style: italic;float: right;">
							<!-- Shared seeing for coordinated action towards achieving outcomes and goals -->
							<h6 style="
									color: white;
									font-size: 16px;
									font-weight: bold;
									line-height: 1.4em;
									margin-top: 10px;
									transform:translate(-50px, 100px)
								">
								{{ loginObj.tagLine }}
							</h6>
						</div>
	</div>
</div>
<script>
	function toggleDiv(){
		const toggleDiv=document.getElementById('toggleDiv');
		toggleDiv.style.display= toggleDiv.style.display==='none'?'block':'none';
	}
</script>
