				<div class="login-box">
	
					<div id="kc-content-wrapper">
						<div>
							<div class="alert alert-error d-flex" *ngIf="error">
								<span class="pficon fa fa-times-circle fa-2x text-danger">{{
									'Invalid
									Credentials'
									}}</span>
	
								<span class="kc-feedback-text ml-2"></span>
							</div>
							<!--<div class="login-box">-->
							<h2>Login</h2>
							<div class="login-form">
								<form class="form" [formGroup]="LoginForm" (ngSubmit)="onSubmitPrivate()"
									id="kc-form-login1" autocomplete="off">
									<label>Username</label><br />
									<input id="username1" class="login-field" formControlName="userId"
										placeholder="Enter your username" type="text" name="username" tabindex="1"
										style="background-color: white;border: none" />
									<br /><br />
									<label>Password</label>
									<input type="password" id="password1" class="login-field" formControlName="password"
										placeholder="Enter your password" name="password" tabindex="2"
										style="background-color: white;border: none" />
									<br />
									<br />
									<button [ngClass]="LoginForm.valid ? 'valid' : ''" class="submit" type="submit"
										id="login" name="login" value="Login" tabindex="3"
										style="background-color: #00bcd4;border: none">
										Sign In
									</button>
								</form>
							</div>
							<!--</div>-->
						</div>
					</div>
					<div class="dashboard_route_div">
						<button (click)="onSubmit()" tabindex="4" class="dashboard_route">Go To Public
							Dashboard</button>
					</div>
					<div id="toggle" onclick="toggleDiv()"></div>
	
				</div>
				<div id="div2" style="display:none;">
			<div class="row">
				<div class="col-lg-12 col-sm-12" style="">

						<h6 style="
													color: white;

							{{ loginObj.tagLine }}

<script>
	function toggleDiv() {
		const toggleDiv = document.getElementById('toggleDiv');
		toggleDiv.style.display = toggleDiv.style.display === 'none' ? 'block' : 'none';
	}
</script>
